# OpenRouter API Configuration Template
# Copy this file to .env and fill in your actual API key
# Get your API key from: https://openrouter.ai/keys

# OpenRouter Configuration (uses OpenAI-compatible API)
OPENROUTER_API_KEY=your_openrouter_api_key_here
OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
OPENROUTER_MODEL=openai/gpt-3.5-turbo
OPENROUTER_TEMPERATURE=0.7
OPENROUTER_MAX_TOKENS=1000

# Gemini API Configuration (Backup/Alternative)
GEMINI_API_KEY=your_gemini_api_key_here
GEMINI_API_URL=https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent

# Application Configuration
SPRING_APPLICATION_NAME=demo
SERVER_PORT=8080

# Logging Configuration
LOGGING_LEVEL_COM_EXAMPLE_DEMO=INFO
