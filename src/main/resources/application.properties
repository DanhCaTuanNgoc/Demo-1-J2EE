spring.application.name=${SPRING_APPLICATION_NAME:demo}

# ===============================
# Encoding Configuration
# ===============================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Console encoding for Windows terminal
spring.output.ansi.enabled=always
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# Java system properties for UTF-8 support
java.awt.headless=true
file.encoding=UTF-8
console.encoding=UTF-8
user.timezone=Asia/Ho_Chi_Minh

# ===============================
# Gemini REST API Configuration
# ===============================
# Sử dụng biến môi trường để bảo mật API key
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent}

# ===============================
# Server Configuration
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# Profile Configuration
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# REST-only mode - No Vertex AI dependencies
# This demo uses only Gemini REST API for cost-effective operation

# ===============================
# Logging Configuration
# ===============================
logging.level.com.example.demo=${LOGGING_LEVEL_COM_EXAMPLE_DEMO:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
