spring.application.name=${SPRING_APPLICATION_NAME:demo}

# ===============================
# Encoding Configuration
# ===============================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Console encoding for Windows terminal
spring.output.ansi.enabled=always
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# Java system properties for UTF-8 support
java.awt.headless=true
file.encoding=UTF-8
console.encoding=UTF-8
user.timezone=Asia/Ho_Chi_Minh

# ===============================
# Spring AI OpenRouter Configuration
# ===============================
# Get your API key from: https://openrouter.ai/keys
# OpenRouter uses OpenAI-compatible API
spring.ai.openai.api-key=${OPENROUTER_API_KEY:your_openrouter_api_key_here}
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:google/gemini-2.0-flash-exp:free}
spring.ai.openai.chat.options.temperature=${OPENROUTER_TEMPERATURE:0.7}
spring.ai.openai.chat.options.max-tokens=${OPENROUTER_MAX_TOKENS:2000}

# System Prompt Configuration - Thuần Spring AI với Memory và Function Calling
spring.ai.openai.system-prompt=${SYSTEM_PROMPT:You are a helpful AI assistant with memory and access to useful tools. \
You can remember information from previous messages in the conversation. \
\
**CAPABILITIES:** \
- Memory: You remember past conversations and can recall information when asked. \
- getCurrentTime: Get current date and time when user asks about time. \
- calculator: Perform basic math operations (add, subtract, multiply, divide) when user needs calculations. \
\
**LANGUAGE:** \
- ALWAYS respond in Vietnamese (tiếng Việt) regardless of the user's language. \
- Only code examples and technical terms can be in English. \
- All explanations, descriptions, and instructions MUST be in Vietnamese. \
\
**FUNCTION CALLING RULES:** \
- ONLY call getCurrentTime when user explicitly asks about current time (e.g., "mấy giờ rồi?", "what time is it?"). \
- ONLY call calculator when user explicitly asks for calculations (e.g., "tính 5+3", "calculate 10*20"). \
- DO NOT call functions for greetings (hi, hello, xin chào) or general questions. \
- When uncertain, respond normally without calling functions. \
\
Always be helpful, accurate, and professional.}

# ===============================
# Gemini REST API Configuration (Legacy - for backup)
# ===============================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent}

# ===============================
# Server Configuration
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# Profile Configuration
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Using Spring AI with Google GenAI API (FREE)
# Get your API key from: https://aistudio.google.com/app/apikey

# ===============================
# Logging Configuration
# ===============================
logging.level.com.example.demo=${LOGGING_LEVEL_COM_EXAMPLE_DEMO:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# Existing config...

# ✅ UTF-8 Encoding Configuration
spring.mandatory-file-encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
