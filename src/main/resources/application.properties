spring.application.name=${SPRING_APPLICATION_NAME:demo}

# ===============================
# Encoding Configuration
# ===============================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Console encoding for Windows terminal
spring.output.ansi.enabled=always
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# Java system properties for UTF-8 support
java.awt.headless=true
file.encoding=UTF-8
console.encoding=UTF-8
user.timezone=Asia/Ho_Chi_Minh

# ===============================
# Spring AI OpenRouter Configuration
# ===============================
# Get your API key from: https://openrouter.ai/keys
# OpenRouter uses OpenAI-compatible API
spring.ai.openai.api-key=${OPENROUTER_API_KEY:your_openrouter_api_key_here}
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openai/gpt-3.5-turbo}
spring.ai.openai.chat.options.temperature=${OPENROUTER_TEMPERATURE:0.7}
spring.ai.openai.chat.options.max-tokens=${OPENROUTER_MAX_TOKENS:1000}

# System Prompt Configuration
spring.ai.openai.system-prompt=${SYSTEM_PROMPT:Bạn là một trợ lý AI hữu ích, chuyên về lập trình Java, Spring Boot và J2EE. \
Bạn có khả năng giải thích mã nguồn, giúp gỡ lỗi và đưa ra hướng dẫn kỹ thuật chi tiết. \
\
**QUAN TRỌNG: Bạn PHẢI LUÔN LUÔN trả lời bằng TIẾNG VIỆT, kể cả khi user hỏi bằng tiếng Anh.** \
Chỉ có code examples thì viết bằng tiếng Anh (vì đó là ngôn ngữ lập trình). \
Tất cả các giải thích, mô tả, hướng dẫn đều PHẢI bằng TIẾNG VIỆT. \
\
**VỀ FUNCTION CALLING:** \
- CHỈ gọi function getCalculator khi user YÊU CẦU TÍNH TOÁN RÕ RÀNG (ví dụ: "tính 5+3", "10 cộng 20 bằng mấy"). \
- KHÔNG gọi function khi user chỉ chào hỏi (hi, hello, xin chào) hoặc hỏi thông tin chung. \
- Khi không chắc chắn, hãy trả lời bình thường thay vì gọi function. \
\
Bạn luôn trả lời một cách rõ ràng, chính xác và chuyên nghiệp. \
Khi viết code, hãy tuân theo các quy ước và thực hành tốt nhất của Java và Spring Boot.}

# ===============================
# Gemini REST API Configuration (Legacy - for backup)
# ===============================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent}

# ===============================
# Server Configuration
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# Profile Configuration
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Using Spring AI with Google GenAI API (FREE)
# Get your API key from: https://aistudio.google.com/app/apikey

# ===============================
# Logging Configuration
# ===============================
logging.level.com.example.demo=${LOGGING_LEVEL_COM_EXAMPLE_DEMO:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
