<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot với Memory + Function Calling</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        .chat-input input:focus {
            border-color: #667eea;
        }

        .chat-input button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .chat-input button:hover {
            background: #5a6fd8;
        }

        .chat-input button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .controls {
            padding: 10px 20px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            text-align: center;
        }

        .controls button {
            padding: 8px 16px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            margin: 0 5px;
        }

        .controls button:hover {
            background: #c82333;
        }

        .loading {
            display: none;
            text-align: center;
            color: #666;
            font-style: italic;
        }

        .error {
            background: #f8d7da !important;
            color: #721c24 !important;
            border: 1px solid #f5c6cb !important;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 Chatbot với Memory</h1>
            <p>Hỏi về thời gian hoặc bất kỳ điều gì khác. Tôi sẽ nhớ cuộc trò chuyện!</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">
                    Xin chào! Tôi là chatbot với khả năng ghi nhớ cuộc trò chuyện và gọi function để lấy thời gian hiện tại. Hãy thử hỏi tôi "Bây giờ là mấy giờ?" hoặc bất kỳ câu hỏi nào khác!
                </div>
            </div>
        </div>
        
        <div class="loading" id="loading">Đang xử lý...</div>
        
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Nhập tin nhắn của bạn..." maxlength="1000">
            <button onclick="sendMessage()" id="sendButton">Gửi</button>
        </div>
        
        <div class="controls">
            <button onclick="clearMemory()">🗑️ Xóa Memory</button>
            <button onclick="showHistory()">📋 Xem Lịch sử</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const loading = document.getElementById('loading');

        // Send message when Enter is pressed
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Add user message to chat
            addMessage(message, 'user');
            messageInput.value = '';
            sendButton.disabled = true;
            loading.style.display = 'block';

            try {
                const response = await fetch('/api/chat/message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                if (response.ok) {
                    addMessage(data.response, 'bot');
                } else {
                    addMessage('Lỗi: ' + data.error, 'bot', true);
                }
            } catch (error) {
                addMessage('Lỗi kết nối: ' + error.message, 'bot', true);
            } finally {
                sendButton.disabled = false;
                loading.style.display = 'none';
                messageInput.focus();
            }
        }


        function addMessage(content, type, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = `message-content ${isError ? 'error' : ''}`;
            contentDiv.textContent = content;
            
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function clearMemory() {
            try {
                const response = await fetch('/api/chat/memory', {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    chatMessages.innerHTML = `
                        <div class="message bot">
                            <div class="message-content">
                                Xin chào! Tôi là chatbot với khả năng ghi nhớ cuộc trò chuyện và gọi function để lấy thời gian hiện tại. Hãy thử hỏi tôi "Bây giờ là mấy giờ?" hoặc bất kỳ câu hỏi nào khác!
                            </div>
                        </div>
                    `;
                    alert('Đã xóa memory thành công!');
                } else {
                    alert('Lỗi khi xóa memory');
                }
            } catch (error) {
                alert('Lỗi: ' + error.message);
            }
        }

        async function showHistory() {
            try {
                const response = await fetch('/api/chat/history');
                const data = await response.json();
                
                if (response.ok) {
                    alert('Lịch sử chat có ' + data.history.length + ' tin nhắn');
                } else {
                    alert('Lỗi khi lấy lịch sử');
                }
            } catch (error) {
                alert('Lỗi: ' + error.message);
            }
        }

        // Focus on input when page loads
        messageInput.focus();
    </script>
</body>
</html>
