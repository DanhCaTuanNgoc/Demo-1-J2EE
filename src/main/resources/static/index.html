<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - DEMO 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --panel: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --muted: #64748b;
            --primary: #22d3ee;
            --ok: #10b981;
            --err: #ef4444;
            --lh: 1.6;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif;
        }

        .wrap {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
        }

        main {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 1fr;
        }

        footer {
            position: sticky;
            bottom: 0;
            padding: 16px;
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .35) 30%, rgba(0, 0, 0, .65));
        }

        .logo {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #22d3ee, #8b5cf6);
            font-weight: 700;
        }

        #chat {
            padding: 18px;
            overflow: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        #chat::-webkit-scrollbar {
            width: 8px;
        }

        #chat::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 4px;
        }

        #chat::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        #chat::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        #chat::-webkit-scrollbar-thumb:active {
            background: var(--primary);
        }

        .msg {
            display: flex;
            gap: 10px;
            margin: 16px 0;
        }

        .msg.user {
            justify-content: flex-end;
        }

        .msg.ai {
            justify-content: flex-start;
        }

        .msg .b {
            max-width: min(90vw, 1100px);
            padding: 12px 14px;
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 14px;
            white-space: pre-wrap;
            line-height: var(--lh);
        }

        .msg .b ol,
        .msg .b ul {
            padding-left: 1.25rem;
            margin: .45rem 0;
        }

        .msg .b p,
        .msg .b li {
            margin: .25rem 0;
        }

        .msg.user .b {
            border-top-right-radius: 6px;
        }

        .msg.ai .b {
            border-top-left-radius: 6px;
        }

        .src {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 12px;
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 999px;
            color: var(--muted);
        }

        .suggest {
            max-width: 1100px;
            margin: 0 auto 10px auto;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 6px;
        }

        .suggest .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            background: #ffffff;
            color: var(--text);
            border-radius: 999px;
            cursor: pointer;
            font-size: 13px;
            user-select: none;
            transition: transform .12s ease, background .12s ease;
        }

        .suggest .chip:hover {
            transform: translateY(-1px);
            background: #f1f5f9;
        }

        .inputbar {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--bg);
            display: grid;
            place-items: center;
            cursor: pointer;
        }

        .btn-icon svg {
            fill: var(--text);
        }

        textarea {
            flex: 1;
            resize: none;
            background: transparent;
            border: 0;
            outline: none;
            color: var(--text);
            max-height: 200px;
            font-size: 16px;
            line-height: 1.5;
            padding: 8px 0;
        }

        .send {
            width: 44px;
            height: 44px;
            border-radius: 999px;
            border: 0;
            background: #fff;
            display: grid;
            place-items: center;
            cursor: pointer;
        }

        .send svg {
            fill: #111;
            width: 20px;
            height: 20px;
        }

        .toast {
            position: fixed;
            right: 16px;
            bottom: 80px;
            display: none;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
        }

        .toast.show {
            display: block;
        }

        .err {
            background: #fef2f2;
            border-color: #fecaca;
            color: #dc2626;
        }

        .hidden {
            display: none;
        }

        .small {
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">AI</div>
    <div><b>AI Assistant</b><div class="small">Trợ lý AI • OpenAI</div></div>
  </header>

  <main>
    <section id="chat"></section>
  </main>

  <footer style="padding-bottom: 50px;">
    <div class="inputbar">
      <textarea id="q" rows="1" placeholder="Nhập tin nhắn..." style="margin-left: 10px;"></textarea>
      <button class="send" id="btnSend" title="Gửi">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3.4 20.6L21 12 3.4 3.4 3 10l11 2-11 2z"/></svg>
      </button>
    </div>
    <div class="small" id="footInfo" style="max-width:1100px;margin:6px auto 0;"></div>
  </footer>
</div>

<div class="toast" id="toast"></div>  

    <script>
        const chat = document.getElementById('chat');
        const messageInput = document.getElementById('q');
        const sendButton = document.getElementById('btnSend');
        const toast = document.getElementById('toast');

        // Add initial welcome message
        addMessage('Xin chào! Tôi là AI Assistant được hỗ trợ bởi OpenAI. Tôi có khả năng ghi nhớ cuộc trò chuyện và có thể gọi các function để lấy thông tin thời gian thực. Hãy thử hỏi tôi "Bây giờ là mấy giờ?" hoặc bất kỳ câu hỏi nào khác!', 'ai');

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        // Send message when Enter is pressed (Shift+Enter for new line)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Send button click handler
        sendButton.addEventListener('click', sendMessage);

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Add user message to chat
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendButton.disabled = true;

            try {
                const response = await fetch('/api/chat/message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                if (response.ok) {
                    addMessage(data.response, 'ai');
                } else {
                    addMessage('Lỗi: ' + data.error, 'ai', true);
                }
            } catch (error) {
                addMessage('Lỗi kết nối: ' + error.message, 'ai', true);
            } finally {
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        function addMessage(content, type, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `msg ${type}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = `b ${isError ? 'err' : ''}`;
            contentDiv.textContent = content;
            
            messageDiv.appendChild(contentDiv);
            chat.appendChild(messageDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = `toast ${type === 'error' ? 'err' : ''}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // PDF upload functionality (simplified - no actual upload)
        document.getElementById('btnPlus').addEventListener('click', function() {
            showToast('Tính năng tải PDF sẽ được phát triển trong tương lai', 'info');
        });

        // Focus on input when page loads
        messageInput.focus();
    </script>
</body>
</html>
