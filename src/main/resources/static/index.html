<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Powered by Gemini</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --background-light: #ffffff;
            --background-dark: #0f172a;
            --surface-light: #f8fafc;
            --surface-dark: #1e293b;
            --text-primary-light: #1e293b;
            --text-primary-dark: #f1f5f9;
            --text-secondary-light: #64748b;
            --text-secondary-dark: #94a3b8;
            --border-light: #e2e8f0;
            --border-dark: #334155;
            --shadow-light: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-dark: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background-light);
            color: var(--text-primary-light);
            height: 100vh;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        body.dark {
            background: var(--background-dark);
            color: var(--text-primary-dark);
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--background-light);
            transition: all 0.3s ease;
        }

        body.dark .app-container {
            background: var(--background-dark);
        }

        .chat-header {
            background: var(--background-light);
            border-bottom: 1px solid var(--border-light);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
        }

        body.dark .chat-header {
            background: var(--background-dark);
            border-bottom-color: var(--border-dark);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary-color), #7c3aed);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            color: white;
        }

        .header-info h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary-light);
            margin-bottom: 2px;
        }

        body.dark .header-info h1 {
            color: var(--text-primary-dark);
        }

        .header-info p {
            font-size: 13px;
            color: var(--text-secondary-light);
            font-weight: 400;
        }

        body.dark .header-info p {
            color: var(--text-secondary-dark);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--surface-light);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: var(--text-secondary-light);
        }

        body.dark .theme-toggle {
            background: var(--surface-dark);
            color: var(--text-secondary-dark);
        }

        .theme-toggle:hover {
            background: var(--border-light);
            transform: scale(1.05);
        }

        body.dark .theme-toggle:hover {
            background: var(--border-dark);
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: var(--surface-light);
            scroll-behavior: smooth;
        }

        body.dark .chat-messages {
            background: var(--surface-dark);
        }

        .message {
            margin-bottom: 24px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: messageSlideIn 0.3s ease-out;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .message-content {
            max-width: 70%;
            padding: 16px 20px;
            border-radius: 16px;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 14px;
            position: relative;
            box-shadow: var(--shadow-light);
        }

        body.dark .message-content {
            box-shadow: var(--shadow-dark);
        }

        .message.user .message-content {
            background: var(--primary-color);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: var(--background-light);
            color: var(--text-primary-light);
            border: 1px solid var(--border-light);
            border-bottom-left-radius: 4px;
        }

        body.dark .message.bot .message-content {
            background: var(--background-dark);
            color: var(--text-primary-dark);
            border-color: var(--border-dark);
        }

        .chat-input {
            padding: 20px 24px;
            background: var(--background-light);
            border-top: 1px solid var(--border-light);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        body.dark .chat-input {
            background: var(--background-dark);
            border-top-color: var(--border-dark);
        }

        .input-container {
            flex: 1;
            position: relative;
            background: var(--surface-light);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.2s ease;
        }

        body.dark .input-container {
            background: var(--surface-dark);
            border-color: var(--border-dark);
        }

        .input-container:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .chat-input textarea {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            max-height: 120px;
            color: var(--text-primary-light);
            font-family: inherit;
        }

        body.dark .chat-input textarea {
            color: var(--text-primary-dark);
        }

        .chat-input textarea::placeholder {
            color: var(--text-secondary-light);
        }

        body.dark .chat-input textarea::placeholder {
            color: var(--text-secondary-dark);
        }

        .send-button {
            width: 44px;
            height: 44px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 16px;
        }

        .send-button:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .send-button:disabled {
            background: var(--secondary-color);
            cursor: not-allowed;
            transform: none;
        }

        .controls {
            padding: 16px 24px;
            background: var(--surface-light);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        body.dark .controls {
            background: var(--surface-dark);
            border-top-color: var(--border-dark);
        }

        .control-button {
            padding: 8px 16px;
            background: var(--surface-light);
            color: var(--text-secondary-light);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        body.dark .control-button {
            background: var(--surface-dark);
            color: var(--text-secondary-dark);
            border-color: var(--border-dark);
        }

        .control-button:hover {
            background: var(--border-light);
            color: var(--text-primary-light);
            transform: translateY(-1px);
        }

        body.dark .control-button:hover {
            background: var(--border-dark);
            color: var(--text-primary-dark);
        }

        .control-button.danger:hover {
            background: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--text-secondary-light);
            font-style: italic;
            padding: 16px;
            font-size: 14px;
        }

        body.dark .loading {
            color: var(--text-secondary-dark);
        }

        .error {
            background: #fef2f2 !important;
            color: #dc2626 !important;
            border: 1px solid #fecaca !important;
        }

        body.dark .error {
            background: #7f1d1d !important;
            color: #fca5a5 !important;
            border-color: #991b1b !important;
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary-light);
            font-size: 14px;
            padding: 16px 20px;
        }

        body.dark .typing-indicator {
            color: var(--text-secondary-dark);
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-secondary-light);
            border-radius: 50%;
            animation: typingDot 1.4s infinite ease-in-out;
        }

        body.dark .typing-dot {
            background: var(--text-secondary-dark);
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingDot {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .chat-header {
                padding: 12px 16px;
            }
            
            .header-info h1 {
                font-size: 16px;
            }
            
            .header-info p {
                font-size: 12px;
            }
            
            .chat-messages {
                padding: 16px;
            }
            
            .message-content {
                max-width: 85%;
                font-size: 13px;
                padding: 12px 16px;
            }
            
            .chat-input {
                padding: 16px;
            }
            
            .controls {
                padding: 12px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .control-button {
                font-size: 12px;
                padding: 6px 12px;
            }
            
            .logo {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }
            
            .theme-toggle {
                width: 36px;
                height: 36px;
            }
        }

        @media (max-width: 480px) {
            .header-info h1 {
                font-size: 14px;
            }
            
            .header-info p {
                display: none;
            }
            
            .message-content {
                max-width: 90%;
                font-size: 12px;
                padding: 10px 14px;
            }
            
            .chat-input {
                padding: 12px;
                gap: 8px;
            }
            
            .input-container {
                padding: 10px 12px;
            }
            
            .send-button {
                width: 40px;
                height: 40px;
                font-size: 14px;
            }
            
            .controls {
                padding: 8px 12px;
            }
            
            .control-button span:last-child {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="chat-header">
            <div class="header-left">
                <div class="logo">AI</div>
                <div class="header-info">
                    <h1>AI Assistant</h1>
                    <p>Powered by Gemini • Memory enabled</p>
                </div>
            </div>
            <div class="header-right">
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    Xin chào! Tôi là AI Assistant được hỗ trợ bởi Gemini. Tôi có khả năng ghi nhớ cuộc trò chuyện và có thể gọi các function để lấy thông tin thời gian thực. Hãy thử hỏi tôi "Bây giờ là mấy giờ?" hoặc bất kỳ câu hỏi nào khác!
                </div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <span>AI đang trả lời</span>
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
        
        <div class="chat-input">
            <div class="input-container">
                <textarea id="messageInput" placeholder="Nhập tin nhắn của bạn..." maxlength="2000" rows="1"></textarea>
            </div>
            <button class="send-button" onclick="sendMessage()" id="sendButton" title="Gửi tin nhắn">
                <span>→</span>
            </button>
        </div>
        
        <div class="controls">
            <button class="control-button danger" onclick="clearMemory()">
                <span>🗑️</span>
                <span>Xóa Memory</span>
            </button>
            <button class="control-button" onclick="showHistory()">
                <span>📋</span>
                <span>Xem Lịch sử</span>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');

        // Theme management
        function toggleTheme() {
            document.body.classList.toggle('dark');
            const themeIcon = document.getElementById('themeIcon');
            themeIcon.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
            localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
            document.getElementById('themeIcon').textContent = '☀️';
        }

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Send message when Enter is pressed (Shift+Enter for new line)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Add user message to chat
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendButton.disabled = true;
            typingIndicator.style.display = 'flex';

            try {
                const response = await fetch('/api/chat/message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                if (response.ok) {
                    addMessage(data.response, 'bot');
                } else {
                    addMessage('Lỗi: ' + data.error, 'bot', true);
                }
            } catch (error) {
                addMessage('Lỗi kết nối: ' + error.message, 'bot', true);
            } finally {
                sendButton.disabled = false;
                typingIndicator.style.display = 'none';
                messageInput.focus();
            }
        }

        function addMessage(content, type, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'message-avatar';
            avatarDiv.textContent = type === 'user' ? 'U' : 'AI';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = `message-content ${isError ? 'error' : ''}`;
            contentDiv.textContent = content;
            
            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function clearMemory() {
            try {
                const response = await fetch('/api/chat/memory', {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    chatMessages.innerHTML = `
                        <div class="message bot">
                            <div class="message-avatar">AI</div>
                            <div class="message-content">
                                Xin chào! Tôi là AI Assistant được hỗ trợ bởi Gemini. Tôi có khả năng ghi nhớ cuộc trò chuyện và có thể gọi các function để lấy thông tin thời gian thực. Hãy thử hỏi tôi "Bây giờ là mấy giờ?" hoặc bất kỳ câu hỏi nào khác!
                            </div>
                        </div>
                    `;
                    showNotification('Đã xóa memory thành công!', 'success');
                } else {
                    showNotification('Lỗi khi xóa memory', 'error');
                }
            } catch (error) {
                showNotification('Lỗi: ' + error.message, 'error');
            }
        }

        async function showHistory() {
            try {
                const response = await fetch('/api/chat/history');
                const data = await response.json();
                
                if (response.ok) {
                    showNotification(`Lịch sử chat có ${data.history.length} tin nhắn`, 'info');
                } else {
                    showNotification('Lỗi khi lấy lịch sử', 'error');
                }
            } catch (error) {
                showNotification('Lỗi: ' + error.message, 'error');
            }
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 16px;
                border-radius: 8px;
                color: white;
                font-size: 14px;
                font-weight: 500;
                z-index: 1000;
                animation: slideInRight 0.3s ease-out;
                max-width: 300px;
            `;
            
            const colors = {
                success: '#10b981',
                error: '#ef4444',
                info: '#3b82f6',
                warning: '#f59e0b'
            };
            
            notification.style.background = colors[type] || colors.info;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOutRight 0.3s ease-in';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Add CSS animations for notifications
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideInRight {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOutRight {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Focus on input when page loads
        messageInput.focus();
    </script>
</body>
</html>
